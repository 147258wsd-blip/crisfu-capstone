<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辩论赛模拟器</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --ink:#2b3445; --sub:#6b7688;
    --pro:#e0524b; --pro-bg:#fdeceb; --pro-line:#f5c6c3;
    --con:#3b7fe0; --con-bg:#eaf2fd; --con-line:#c3d8f5;
    --ok:#2fa871; --line:#e4e9f2; --accent:#7c5cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px}
  .hidden{display:none!important}

  /* ---------- 玩家成长面板 ---------- */
  .player-card{
    background:linear-gradient(135deg,#2f2752,#4a3a86 58%,#6a4fd0);
    color:#fff;border-radius:18px;padding:16px 18px 14px;margin-bottom:16px;
    box-shadow:0 8px 22px rgba(74,58,134,.26);
  }
  .pc-top{display:flex;align-items:center;gap:12px}
  .lv-badge{
    width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.3);display:flex;flex-direction:column;
    align-items:center;justify-content:center;flex:none;line-height:1.05;
  }
  .lv-badge b{font-size:17px}
  .lv-badge span{font-size:8px;letter-spacing:1.5px;opacity:.75;margin-top:2px}
  .pc-name{font-size:16px;font-weight:800;letter-spacing:1px}
  .pc-sub{font-size:11.5px;opacity:.78;margin-top:3px}
  .pc-pts{margin-left:auto;text-align:right;flex:none}
  .pc-pts b{font-size:21px;letter-spacing:.5px}
  .pc-pts span{font-size:10px;opacity:.7;display:block;margin-top:1px}
  .pc-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.18);margin:13px 0 5px;overflow:hidden}
  .pc-bar i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,#ffd76e,#ff9f45);transition:width .55s ease;box-shadow:0 0 10px rgba(255,183,77,.5)}
  .pc-scale{display:flex;justify-content:space-between;font-size:10px;opacity:.68}
  .pc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;
    padding-top:11px;border-top:1px solid rgba(255,255,255,.15)}
  .pc-stats div{text-align:center}
  .pc-stats b{display:block;font-size:15px;font-weight:800}
  .pc-stats span{font-size:10px;opacity:.72}
  .pc-rule{font-size:10px;opacity:.6;margin-top:10px;text-align:center}

  /* ---------- 首页 ---------- */
  .hero{text-align:center;margin-bottom:22px}
  .hero h1{font-size:30px;letter-spacing:2px}
  .hero p{color:var(--sub);margin-top:6px;font-size:14px}
  .block{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(40,60,100,.05);
  }
  .block h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .block h2 .no{
    width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none;
  }
  .block h2 .tip{font-weight:400;color:var(--sub);font-size:12px;margin-left:auto}

  .opt-grid{display:grid;gap:10px}
  .grid-2{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:1fr 1fr 1fr}

  .opt{
    border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;
    background:#fff;transition:all .15s;text-align:left;width:100%;font-family:inherit;
  }
  .opt:hover{border-color:#b9c4d8;transform:translateY(-1px)}
  .opt .name{font-weight:700;font-size:15px}
  .opt .desc{color:var(--sub);font-size:12px;margin-top:4px;line-height:1.5}
  .opt.sel{border-color:var(--accent);background:#f6f3ff;box-shadow:0 0 0 3px rgba(124,92,255,.12)}
  .opt.sel .name{color:var(--accent)}

  .topic-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .cat-badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef1f7;color:var(--sub);flex:none}
  .cat-生活{background:#e6f6ee;color:#2b8a5b}
  .cat-脑洞{background:#efe9ff;color:#6b4ee6}
  .cat-流行{background:#fdeaf1;color:#c3467a}
  .cat-成长{background:#e8f0fd;color:#2f6fcf}
  .stars{font-size:11px;color:#f0a92e;letter-spacing:1px}
  .hint-line{font-size:11px;color:var(--sub);margin-top:7px;line-height:1.6}
  .stat-line{font-size:11px;color:#8b93a5;margin-top:5px}
  .filter-row{margin-bottom:12px}
  .chip.selectable{cursor:pointer;background:#fff;transition:all .15s}
  .chip.selectable:hover{border-color:#b9c4d8}
  .chip.selectable.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- 抽卡 ---------- */
  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:620px){.card-grid{grid-template-columns:1fr;gap:10px}}
  .draw-card{
    position:relative;perspective:1000px;background:none;border:none;padding:0;
    font-family:inherit;height:206px;min-width:0;cursor:pointer;
  }
  @media(max-width:620px){.draw-card{height:172px}}
  .card-inner{
    position:relative;width:100%;height:100%;transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    transition:transform .62s cubic-bezier(.36,.9,.32,1.04);
  }
  .draw-card.flipped .card-inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;
    -webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;
  }
  .face-back{
    align-items:center;justify-content:center;gap:7px;color:#fff;
    background:linear-gradient(150deg,#8a6cff,#5a3fd6 58%,#3b2699);
    border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(90,63,214,.26);
  }
  .face-back .glyph{font-size:34px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.3))}
  .face-back .word{font-size:11px;letter-spacing:4px;opacity:.82}
  .face-back::after{content:"";position:absolute;inset:8px;border:1px dashed rgba(255,255,255,.32);border-radius:10px}
  .draw-card:not(.flipped):hover .face-back{filter:brightness(1.08)}
  .face-front{
    transform:rotateY(180deg);background:#fff;border:2px solid var(--line);
    padding:10px 12px;text-align:left;box-shadow:0 4px 14px rgba(40,60,100,.07);
    transition:border-color .2s,background .2s,box-shadow .2s;
  }
  .draw-card.sel .face-front{
    border-color:var(--accent);background:#f8f5ff;box-shadow:0 0 0 3px rgba(124,92,255,.15);
  }
  .face-front .vs{font-size:10px;color:var(--sub);margin:2px 0;letter-spacing:1px}
  .face-front .side-p,.face-front .side-c{font-size:12.5px;line-height:1.4;font-weight:700}
  .face-front .side-p{color:var(--pro)}
  .face-front .side-c{color:var(--con)}
  .face-front .hint-line{
    font-size:11px;color:var(--sub);margin-top:auto;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .face-front .stat-line{font-size:10.5px;color:#8b93a5;margin-top:4px;line-height:1.4}
  .sel-flag{
    position:absolute;top:-8px;right:10px;z-index:5;background:var(--accent);color:#fff;
    font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;display:none;
    box-shadow:0 3px 8px rgba(124,92,255,.35);
  }
  .draw-card.sel .sel-flag{display:block}
  .draw-tip{font-size:11.5px;color:var(--sub);margin-top:10px;text-align:center}
  .debate-hint{
    font-size:12px;color:var(--sub);background:#fff;border:1px dashed var(--line);
    border-radius:10px;padding:8px 12px;margin-bottom:10px;line-height:1.6;
  }

  .stance-card.sel-p{border-color:var(--pro);background:var(--pro-bg);box-shadow:0 0 0 3px rgba(224,82,75,.12)}
  .stance-card.sel-c{border-color:var(--con);background:var(--con-bg);box-shadow:0 0 0 3px rgba(59,127,224,.12)}
  .stance-card .tag{font-size:12px;font-weight:700}
  .stance-card .tag.p{color:var(--pro)} .stance-card .tag.c{color:var(--con)}
  .stance-placeholder{color:var(--sub);font-size:13px;text-align:center;padding:14px}

  .batch-btn{
    background:#eef1f7;border:1px solid var(--line);border-radius:8px;padding:6px 14px;
    cursor:pointer;font-size:13px;color:var(--ink);font-family:inherit;
  }
  .batch-btn:hover{background:#e2e8f2}

  .start-row{text-align:center;margin-top:22px}
  #startBtn{
    font-size:18px;font-weight:700;color:#fff;border:none;border-radius:14px;
    padding:14px 60px;cursor:pointer;font-family:inherit;transition:all .2s;
    background:linear-gradient(135deg,#7c5cff,#9b7bff);box-shadow:0 6px 16px rgba(124,92,255,.35);
  }
  #startBtn:disabled{background:#c8cdd8;box-shadow:none;cursor:not-allowed}
  #startBtn:not(:disabled):hover{transform:translateY(-2px)}
  .start-hint{color:var(--sub);font-size:12px;margin-top:8px}

  /* ---------- 对局页 ---------- */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .ghost-btn{
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 14px;
    cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink);
  }
  .ghost-btn:hover{background:#eef1f7}
  .topbar .title{
    flex:1;text-align:center;font-weight:700;font-size:14px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .score-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    display:flex;align-items:center;justify-content:space-around;padding:16px 12px;margin-bottom:12px;
  }
  .score-side{text-align:center;min-width:130px}
  .score-side .who{font-size:12px;font-weight:700}
  .score-side .who.p{color:var(--pro)} .score-side .who.c{color:var(--con)}
  .score-side .name{font-size:13px;margin-top:2px}
  .score-side .num{font-size:34px;font-weight:800;margin-top:2px}
  .score-side.p .num{color:var(--pro)} .score-side.c .num{color:var(--con)}
  .score-mid{text-align:center}
  .score-mid .round{font-size:15px;font-weight:700}
  .score-mid .diff{color:var(--sub);font-size:12px;margin-top:4px}
  .bump{animation:bump .4s}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

  .chat{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    height:44vh;min-height:280px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;
  }
  .msg{display:flex;flex-direction:column;max-width:82%}
  .msg .meta{font-size:11px;color:var(--sub);margin-bottom:3px}
  .msg .bubble{
    padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.7;
    position:relative;word-break:break-word;white-space:pre-wrap;
  }
  .msg .score-badge{
    font-size:11px;font-weight:700;margin-top:3px;color:var(--ok);
  }
  .msg .score-badge .neg{color:var(--pro)}
  .eval-comments{
    font-size:11px;color:var(--sub);margin-top:2px;line-height:1.7;text-align:left;
  }
  .msg.left{align-self:flex-start}
  .msg.left .bubble{background:#f1f3f8;border-top-left-radius:4px}
  .msg.right{align-self:flex-end;align-items:flex-end}
  .msg.right .bubble{border-top-right-radius:4px}
  .msg.right .bubble.pb{background:var(--pro-bg);border:1px solid var(--pro-line)}
  .msg.left  .bubble.pb{background:var(--pro-bg);border:1px solid var(--pro-line)}
  .msg.right .bubble.cb{background:var(--con-bg);border:1px solid var(--con-line)}
  .msg.left  .bubble.cb{background:var(--con-bg);border:1px solid var(--con-line)}
  .meta .mtag{font-weight:700}
  .meta .mtag.p{color:var(--pro)} .meta .mtag.c{color:var(--con)}

  .banner{
    align-self:center;text-align:center;background:#fffbe8;border:1px solid #f0e2a0;
    border-radius:12px;padding:14px 22px;font-size:15px;font-weight:700;max-width:92%;
  }
  .banner .sub2{font-size:12px;color:var(--sub);font-weight:400;margin-top:6px}
  .banner .gain{
    font-size:12px;color:var(--sub);font-weight:400;margin-top:9px;line-height:1.9;
    background:#fff;border:1px dashed #ecdca6;border-radius:10px;padding:8px 12px;text-align:left;
  }
  .banner .gain b{color:var(--ok)}
  .banner .gain .lvup{color:#d97706;font-weight:700}
  .banner button{margin-top:10px}

  .turnbar{
    margin:12px 0 8px;display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:600;
  }
  .turnbar .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .turnbar.mine .dot{background:var(--ok);animation:blink 1.2s infinite}
  .turnbar.wait .dot{background:#f0b429;animation:blink 1.2s infinite}
  .turnbar.over .dot{background:#9aa3b5}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  details.kwhint{margin-bottom:10px;font-size:13px}
  details.kwhint summary{cursor:pointer;color:var(--sub);font-size:12px;user-select:none}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;font-size:12px;color:var(--ink);
  }
  .chip small{color:var(--sub)}

  .input-row{display:flex;gap:10px;margin-top:8px}
  #msgInput{
    flex:1;border:2px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink);
  }
  #msgInput:focus{border-color:var(--accent)}
  #msgInput:disabled{background:#f1f3f8;color:var(--sub)}
  #sendBtn{
    background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:0 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  #sendBtn:disabled{background:#c8cdd8;cursor:not-allowed}

  /* ---------- 语音输入 ---------- */
  #voiceBtn{
    flex:none;width:48px;border:2px solid var(--line);border-radius:12px;background:#fff;
    font-size:19px;line-height:1;cursor:pointer;padding:0;
  }
  #voiceBtn:hover{border-color:var(--accent)}
  #voiceBtn.rec{background:var(--pro-bg);border-color:var(--pro);animation:vpulse 1.1s infinite}
  #voiceBtn.off{opacity:.42;cursor:not-allowed}
  #voiceBtn.off:hover{border-color:var(--line)}
  @keyframes vpulse{0%,100%{box-shadow:0 0 0 0 rgba(224,82,75,.35)}50%{box-shadow:0 0 0 6px rgba(224,82,75,0)}}
  .voice-hint{font-size:11.5px;color:var(--sub);margin-top:7px;line-height:1.5}
  .voice-hint.warn{color:var(--pro)}

  /* ---------- 机器人思考动画 ---------- */
  .typing{display:inline-flex;align-items:center;gap:5px;min-width:58px;padding:13px 15px!important}
  .typing i{width:6px;height:6px;border-radius:50%;background:#9aa3b5;display:inline-block;animation:tdot 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes tdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ 首页 ============ -->
  <main id="homeView">
    <div class="hero">
      <h1>🎙️ 辩论赛模拟器</h1>
      <p>抽一张辩题卡，站队开辩——攒积分升级，成为辩论大师！</p>
    </div>

    <!-- 成长面板 -->
    <section class="player-card">
      <div class="pc-top">
        <div class="lv-badge"><b id="lvNum">1</b><span>LV</span></div>
        <div>
          <div class="pc-name" id="lvName">辩论新手</div>
          <div class="pc-sub" id="pcSub">赢一场就能升级啦</div>
        </div>
        <div class="pc-pts"><b id="pcPts">0</b><span>累计积分</span></div>
      </div>
      <div class="pc-bar"><i id="pcBar" style="width:0%"></i></div>
      <div class="pc-scale"><span id="pcScaleL">Lv.1 · 0 分</span><span id="pcScaleR"></span></div>
      <div class="pc-stats">
        <div><b id="stStreak">0</b><span>当前连胜</span></div>
        <div><b id="stBestStreak">0</b><span>最高连胜</span></div>
        <div><b id="stPlays">0</b><span>总场次</span></div>
        <div><b id="stWinRate">—</b><span>胜率</span></div>
      </div>
      <div class="pc-rule">积分规则：每局得分全额计入 · 赢局额外 +20</div>
    </section>

    <!-- 1 对战模式 -->
    <section class="block">
      <h2><span class="no">1</span>对战模式</h2>
      <div class="opt-grid grid-2" id="modeRow">
        <button class="opt sel" data-mode="pve">
          <div class="name">🤖 人机对战</div>
          <div class="desc">和内置 AI 辩手过招，它随时接招反驳你</div>
        </button>
        <button class="opt" data-mode="pvp">
          <div class="name">👥 人人对战</div>
          <div class="desc">和同桌轮流发言，一人执正方、一人执反方</div>
        </button>
      </div>
    </section>

    <!-- 2 抽卡选辩题 -->
    <section class="block">
      <h2><span class="no">2</span>抽取辩题
        <span class="tip"><span id="poolTip">共 100 道 · 每次抽 3 张</span>
          <button class="batch-btn" id="shuffleBtn">🎴 抽 3 张</button>
        </span>
      </h2>
      <div class="chip-row filter-row" id="catRow"></div>
      <div class="card-grid" id="cardGrid"></div>
      <div class="draw-tip" id="drawTip">卡背依次翻开，点选一张作为本场辩题</div>
    </section>

    <!-- 3 正反方立场 -->
    <section class="block">
      <h2><span class="no">3</span>选择你的立场</h2>
      <div id="stanceBox"><div class="stance-placeholder">先翻一张卡、选一道辩题吧～</div></div>
    </section>

    <!-- 4 难度 -->
    <section class="block">
      <h2><span class="no">4</span>难度选择</h2>
      <div class="opt-grid grid-3" id="diffRow">
        <button class="opt sel" data-diff="0">
          <div class="name">🌱 初级</div>
          <div class="desc">对手论据简单、判分宽松，适合热身</div>
        </button>
        <button class="opt" data-diff="1">
          <div class="name">🔥 中级</div>
          <div class="desc">棋逢对手，会抓住你的漏洞进行反驳</div>
        </button>
        <button class="opt" data-diff="2">
          <div class="name">⚡ 高级</div>
          <div class="desc">对手连珠炮式输出，判分严格，慎入！</div>
        </button>
      </div>
    </section>

    <div class="start-row">
      <button id="startBtn" disabled>开始辩论</button>
      <div class="start-hint" id="startHint">还需要：选择辩题、选择立场</div>
    </div>
  </main>

  <!-- ============ 对局页 ============ -->
  <main id="debateView" class="hidden">
    <div class="topbar">
      <button class="ghost-btn" id="backBtn">← 返回</button>
      <div class="title" id="debateTitle"></div>
      <button class="ghost-btn" id="endBtn">⏹ 提前结束</button>
    </div>

    <div class="score-card">
      <div class="score-side p">
        <div class="who p">正方</div>
        <div class="name" id="proName"></div>
        <div class="num" id="proScore">0</div>
      </div>
      <div class="score-mid">
        <div class="round" id="roundText">第 1 / 3 轮</div>
        <div class="diff" id="diffText"></div>
      </div>
      <div class="score-side c">
        <div class="who c">反方</div>
        <div class="name" id="conName"></div>
        <div class="num" id="conScore">0</div>
      </div>
    </div>

    <div class="debate-hint" id="debateHint"></div>

    <details class="kwhint" id="kwHint">
      <summary>💡 查看本方关键词提示（多用关键词，得分更高！）</summary>
      <div class="chip-row" id="kwChips"></div>
    </details>

    <div class="chat" id="chat"></div>

    <div class="turnbar mine" id="turnBar"><span class="dot"></span><span id="turnText"></span></div>

    <div class="input-row">
      <input id="msgInput" maxlength="200" placeholder="">

/* ==================== 状态 / 成长 ==================== */
const MAX_ROUNDS=3, MSGS_TOTAL=MAX_ROUNDS*2;
const DIFF_NAMES=["初级","中级","高级"];
const DIFF_MULT=[0.7,1.0,1.35];
const CATS=["全部","生活","脑洞","流行","成长"];
const TOPIC_BY_ID=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const OLD_IDS=Array.from({length:24},(_,i)=>"t"+String(i+1).padStart(2,"0"));
const SAVE_KEY="debateSim.save";
const CARDS_PER_DRAW=3;      // 每次抽 3 张
const WIN_BONUS=20;          // 赢局额外积分
/* 7 个等级：need = 达到该等级所需的累计积分 */
const LEVELS=[
  {lv:1,name:"辩论新手",need:0},
  {lv:2,name:"能说会道",need:80},
  {lv:3,name:"巧舌如簧",need:200},
  {lv:4,name:"妙语连珠",need:420},
  {lv:5,name:"辩场老手",need:760},
  {lv:6,name:"雄辩之才",need:1200},
  {lv:7,name:"辩论大师",need:1800}
];
const DEFAULT_GROWTH={pts:0,streak:0,bestStreak:0,plays:0,wins:0};

const state={mode:"pve",topicIdx:null,side:null,diff:0,filter:"全部",
  scores:{p:0,c:0},round:1,msgCount:0,waiting:false,finished:false,cards:[],
  stats:{},growth:Object.assign({},DEFAULT_GROWTH)};

const $=id=>document.getElementById(id);
const starStr=d=>"★".repeat(d)+"☆".repeat(3-d);

function levelInfo(pts){
  let cur=LEVELS[0];
  for(const L of LEVELS)if(pts>=L.need)cur=L;
  const next=LEVELS[LEVELS.indexOf(cur)+1]||null;
  if(!next)return{cur,next:null,ratio:1,remain:0,maxed:true};
  return{cur,next,ratio:Math.min(1,Math.max(0,(pts-cur.need)/(next.need-cur.need))),
    remain:Math.max(0,next.need-pts),maxed:false};
}

/* ---- 存档：v3 = 题目战绩 + 成长系统；兼容旧版数字下标 / 无 growth 存档 ---- */
function loadSave(){
  let raw=null;
  try{raw=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");}catch(e){raw=null;}
  const blank={mode:"pve",diff:0,stats:{},growth:Object.assign({},DEFAULT_GROWTH)};
  if(!raw||typeof raw!=="object"||Array.isArray(raw))return blank;

  const stats={};
  const src=(raw.stats&&typeof raw.stats==="object"&&!Array.isArray(raw.stats))?raw.stats:{};
  Object.keys(src).forEach(k=>{
    const id=/^\d+$/.test(k)?(OLD_IDS[+k]||null):k;
    if(!id||!TOPIC_BY_ID[id])return;
    const r=src[k];
    if(typeof r==="number"){stats[id]={plays:1,best:Math.max(0,Math.round(r)),wins:0};return;}
    if(!r||typeof r!=="object")return;   // 脏字段直接丢掉，当作没记录
    stats[id]={
      plays:Math.max(0,Math.round(+r.plays||0)),
      best:Math.max(0,Math.round(+r.best||0)),
      wins:Math.max(0,Math.round(+r.wins||0))
    };
  });

  let growth;
  if(raw.growth&&typeof raw.growth==="object"&&!Array.isArray(raw.growth)){
    const g=raw.growth;
    growth={
      pts:Math.max(0,Math.round(+g.pts||0)),
      streak:Math.max(0,Math.round(+g.streak||0)),
      bestStreak:Math.max(0,Math.round(+g.bestStreak||0)),
      plays:Math.max(0,Math.round(+g.plays||0)),
      wins:Math.max(0,Math.round(+g.wins||0))
    };
  }else{
    /* 老存档没有成长数据：用逐题战绩近似回填（每题最佳分之和 + 胜场奖励），老玩家不白玩 */
    let pts=0,plays=0,wins=0;
    Object.keys(stats).forEach(id=>{
      const r=stats[id];
      plays+=r.plays;wins+=r.wins;pts+=r.best+r.wins*WIN_BONUS;
    });
    growth={pts,streak:0,bestStreak:0,plays,wins};
  }
  return{mode:raw.mode==="pvp"?"pvp":"pve",diff:[0,1,2].includes(raw.diff)?raw.diff:0,stats,growth};
}
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      v:3,mode:state.mode,diff:state.diff,stats:state.stats,growth:state.growth,
      lastTopicId:state.topicIdx!==null?TOPICS[state.topicIdx].id:null
    }));
  }catch(e){}
}
function recOf(id){return state.stats[id]||null;}

/* 一局结束：写本题战绩 + 结算积分（得分全额 + 赢局奖励），返回结算明细 */
function recordStat(){
  const t=TOPICS[state.topicIdx];if(!t)return null;
  const mine=state.scores[state.side],opp=state.scores[otherSide()];
  const win=mine>opp,tie=mine===opp;

  const rec=state.stats[t.id]||{plays:0,best:0,wins:0};
  rec.plays++;rec.best=Math.max(rec.best,mine);if(win)rec.wins++;
  state.stats[t.id]=rec;

  const g=state.growth;
  const before=levelInfo(g.pts).cur.lv;
  const bonus=win?WIN_BONUS:0;
  g.plays++;if(win)g.wins++;
  g.pts+=Math.max(0,mine)+bonus;
  g.streak=win?g.streak+1:0;
  g.bestStreak=Math.max(g.bestStreak,g.streak);
  const after=levelInfo(g.pts);
  saveGame();
  return{mine,opp,win,tie,bonus,gain:Math.max(0,mine)+bonus,
    levelUp:after.cur.lv>before,lv:after,streak:g.streak};
}

/* ============ 评分函数 evaluate(发言, 立场) ============
   五个维度：① 讲道理（权重最高）② 切题（关键词含同义词）
   ③ 长度 ④ 反驳对方 ⑤ 举例子
   规则：只喊口号 0 分；复述题目 0 分；
   出坏主意（作弊/打人/撒谎等）或骂人 → 直接扣分。
   返回 { score 分数, stars 星级, comments 逐条点评 } */
function evaluate(text,side){
  const topic=TOPICS[state.topicIdx];
  const data=side==="p"?topic.pro:topic.con;
  const oppData=side==="p"?topic.con:topic.pro;
  const comments=[];
  const clean=text.replace(/[\s，。！？!?,.、；;：:""''（）()「」]+/g,"");
  let score=0;

  function finalize(){
    score=Math.round(score);
    const s=score>=20?5:score>=15?4:score>=10?3:score>=6?2:score>0?1:0;
    return {score,stars:"★".repeat(s)+"☆".repeat(5-s),comments};
  }

  /* ---- 红线检查：坏主意 / 骂人 → 直接扣分并终止 ---- */
  const badIdeas=["作弊","抄作业","打人","打架","撒谎","逃学"];
  const insults=["笨蛋","白痴","蠢货","傻子","闭嘴","滚","有病","垃圾","放屁"];
  let bad=false;
  badIdeas.forEach(w=>{
    if(text.includes(w)){score-=4;bad=true;
      comments.push(`❌ 出坏主意：提到「${w}」，这不是好办法，直接扣分！（-4）`);}
  });
  insults.forEach(w=>{
    if(text.includes(w)){score-=4;bad=true;
      comments.push("❌ 骂人不文明！辩论要靠道理服人，不能靠嗓门和脏话。（-4）");}
  });
  if(bad)return finalize();

  /* ---- 红线检查：只喊口号 → 0 分 ---- */
  const sloganClean=clean.replace(/肯定是|不用说|肯定对|肯定好|就是这样|必须的|反正就是|对对对|废话|当然啦/g,"");
  if(sloganClean.length<4){
    comments.push("❌ 只是在喊口号，没有讲出任何道理，不给分。");
    return finalize();
  }
  /* ---- 红线检查：复述题目 → 0 分 ---- */
  let echoClean=clean;
  [topic.p,topic.c].forEach(s=>{echoClean=echoClean.split(s).join("");});
  if(echoClean.length<4){
    comments.push("❌ 只是复述了辩题本身，没有说出自己的观点，不给分。");
    return finalize();
  }

  /* ---- ① 讲道理（权重最高，上限 12 分）---- */
  let logic=0;
  const cause=/因为|由于|既然/.test(text);
  const result=/所以|因此/.test(text);
  if(cause){logic+=3;comments.push("✅ 讲道理：给出了理由（因为…）（+3）");}
  if(result){logic+=3;comments.push("✅ 讲道理：推出了结论（所以…）（+3）");}
  if(cause&&result){logic+=1;comments.push("✅ 因果链条完整，加一分！（+1）");}
  if(/如果|要是|假如|假设/.test(text)){logic+=3;comments.push("✅ 讲道理：用了假设推理「如果…」（+3）");}
  if(/如果[^。！？]{1,20}就|要是[^。！？]{1,20}那么/.test(text)){logic+=1;comments.push("✅ 「如果…就…」推理完整（+1）");}
  if(/但是|可是|然而|虽然/.test(text)){logic+=2;comments.push("✅ 讲道理：考虑了事情的另一面「但是…」（+2）");}
  logic=Math.min(logic,12);
  score+=logic;
  if(logic===0)comments.push("⚠️ 讲道理：没有用「因为/所以/如果/但是」这些句式，说理感不强（+0）");

  /* ---- ② 切题：命中本题关键词（含同义词），每组建 2 分 ---- */
  const hitWords=[];
  data.kw.forEach(g=>{const w=g.find(w=>text.includes(w));if(w)hitWords.push(w);});
  const onTopic=Math.min(hitWords.length*2,8);
  if(hitWords.length){
    score+=onTopic;
    comments.push(`✅ 切题：命中关键词「${hitWords.join("」「")}」（+${onTopic}）`);
  }else{
    comments.push("⚠️ 切题：没有命中本题关键词，观点容易跑偏（+0）");
  }

  /* ---- ③ 长度：太短没分量，充分表达有加分 ---- */
  const len=clean.length;
  let lenPts=0;
  if(len>=60)lenPts=3;else if(len>=30)lenPts=2;else if(len>=15)lenPts=1;
  score+=lenPts;
  comments.push(lenPts===0
    ?`⚠️ 长度：只有 ${len} 字，太短了，多讲几句会更有说服力（+0）`
    :`✅ 长度：${len} 字，表达充分（+${lenPts}）`);

  /* ---- ④ 反驳对方：正面回应对方观点（上限 5 分）---- */
  let reb=0;
  if(/对方辩友|不认同|反驳|反对|恰恰相反|不同意/.test(text)){
    reb+=3;comments.push("✅ 反驳：直接回应了对方的说法（+3）");
  }
  const oppHit=[];
  oppData.kw.forEach(g=>{const w=g.find(w=>text.includes(w));if(w)oppHit.push(w);});
  if(oppHit.length){reb+=2;comments.push(`✅ 反驳：点出了对方立场中的「${oppHit[0]}」（+2）`);}
  reb=Math.min(reb,5);
  if(reb===0)comments.push("⚠️ 反驳：没有回应对方观点，各说各的话（+0）");
  score+=reb;

  /* ---- ⑤ 举例子：例子让道理落地（上限 6 分）---- */
  let ex=0;
  if(/比如说|比如|例如|举例|打个比方|就像/.test(text)){
    ex+=3;comments.push("✅ 举例子：用「比如说…」举例说明（+3）");
  }
  if(/历史上|科学家|名人|有一次|我们班|新闻里/.test(text)){
    ex+=3;comments.push("✅ 举例子：举了具体的事例（+3）");
  }
  ex=Math.min(ex,6);
  score+=ex;
  if(ex===0)comments.push("💡 建议：加一个例子（比如说…）会更有说服力（+0）");

  return finalize();
}

/* AI 辩手：根据难度组织反驳+论据 */
let usedArgs={p:new Set(),c:new Set()};
function pickArg(side){
  const data=side==="p"?TOPICS[state.topicIdx].pro:TOPICS[state.topicIdx].con;
  const unused=data.args.filter((_,i)=>!usedArgs[side].has(i));
  const pool=unused.length?unused:data.args;
  if(!unused.length)usedArgs[side].clear();
  const raw=pool[Math.floor(Math.random()*pool.length)];
  usedArgs[side].add(data.args.indexOf(raw));   // 先按原句记「已用」，再做同义词替换
  let text=raw;
  if(Math.random()<0.4){
    const g=data.kw[Math.floor(Math.random()*data.kw.length)];
    if(g.length>1&&text.includes(g[0]))text=text.replace(g[0],g[1+Math.floor(Math.random()*(g.length-1))]);
  }
  return text;
}

/* 只认对方「真的说过」的词：在用户原话里逐字查找双方关键词组（含同义词） */
function spokenKeywords(text){
  const t=TOPICS[state.topicIdx];
  const hits=[];
  [t.pro,t.con].forEach(d=>d.kw.forEach(g=>g.forEach(w=>{
    if(w.length>=2&&text.includes(w)&&!hits.some(h=>h.w===w))
      hits.push({w,at:text.indexOf(w),n:text.split(w).length-1});
  })));
  /* 长词优先，避免「全」盖住「安全」这类包含关系 */
  hits.sort((a,b)=>b.w.length-a.w.length);
  const kept=[];
  hits.forEach(h=>{if(!kept.some(k=>k.w.includes(h.w)))kept.push(h);});
  kept.sort((a,b)=>a.at-b.at);
  return kept.slice(0,2);
}

/* 保证句子完整：末尾若是半截话，就截到最后一个句号/问号/感叹号 */
function ensureComplete(s){
  const t=String(s||"").trim();
  if(!t)return"";
  if(/[。！？…]$/.test(t))return t;
  const i=Math.max(t.lastIndexOf("。"),t.lastIndexOf("！"),t.lastIndexOf("？"));
  return i>=0?t.slice(0,i+1):t+"。";
}

function botReply(userText){
  const bot=otherSide();
  const name=sideName(bot);
  const picks=spokenKeywords(userText||"");
  const a1=pickArg(bot);

  /* 接话：只引用对方真正说过的词；没说到就坦白「听到你的发言」，绝不编造对方观点 */
  let lead;
  if(picks.length){
    const p=picks[0];
    lead=(p.n>=2&&state.diff>=1)?`你反复提到「${p.w}」，不过`:`你刚才说到「${p.w}」，不过`;
  }else{
    lead=["你的发言我听到了，不过","我明白你的意思，不过","这个说法我不敢完全同意，不过"][Math.floor(Math.random()*3)];
  }

  let text;
  if(state.diff===0){
    text=lead+a1;
  }else if(state.diff===1){
    text=lead+a1+`所以我认为「${name}」。`;
  }else{
    const a2=pickArg(bot);
    text=lead+a1+a2+(picks.length
      ?`请问对方辩友，你怎么解释「${picks[0].w}」呢？`
      :"请问对方辩友，这一点你怎么解释呢？");
  }
  text=ensureComplete(text);

  const ev=evaluate(text,bot);
  const score=Math.round(ev.score*DIFF_MULT[state.diff]);
  addMsg(bot,text,Object.assign({},ev,{score}));
  state.scores[bot]+=score;
  bumpScore(bot);
}

function bumpScore(side){
  const el=$(side==="p"?"proScore":"conScore");
  el.textContent=state.scores[side];
  el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");
}

/* 机器人思考动画：三个跳动的小点，约 1.5 秒后换成正式发言 */
function showTyping(){
  hideTyping();
  const bot=otherSide();
  const d=document.createElement("div");
  d.className="msg left";d.id="typingMsg";
  d.innerHTML=`<div class="meta"><span class="mtag ${bot}">【${sideWord(bot)}】</span>${sideName(bot)} 正在思考</div>
    <div class="bubble ${bot==="p"?"pb":"cb"} typing"><i></i><i></i><i></i></div>`;
  $("chat").appendChild(d);$("chat").scrollTop=1e9;
}
function hideTyping(){
  const el=$("typingMsg");
  if(el&&el.parentNode)el.parentNode.removeChild(el);
}

let lastUserText="";
function send(){
  const inp=$("msgInput");
  const text=inp.value.trim();
  if(!text||state.finished)return;
  inp.value="";
  if(state.mode==="pve"){
    if(state.waiting)return;
    const ev=evaluate(text,state.side);
    addMsg(state.side,text,ev);state.scores[state.side]+=ev.score;bumpScore(state.side);
    state.msgCount++;
    if(state.msgCount>=MSGS_TOTAL){finish();return;}
    state.waiting=true;lastUserText=text;updateTurnBar();
    showTyping();
    setTimeout(()=>{
      hideTyping();
      if(state.finished)return;
      botReply(lastUserText);
      state.waiting=false;state.round++;state.msgCount++;
      if(state.msgCount>=MSGS_TOTAL){updateTurnBar();finish();return;}
      updateTurnBar();
    },1500);
  }else{
    const cur=state.turnSide;
    const ev=evaluate(text,cur);
    addMsg(cur,text,ev);state.scores[cur]+=ev.score;bumpScore(cur);
    state.msgCount++;
    if(state.msgCount>=MSGS_TOTAL){updateTurnBar();finish();return;}
    const next=cur==="p"?"c":"p";
    if(next===state.side)state.round++;
    state.turnSide=next;
    updateTurnBar();
  }
}

function finish(){
  state.finished=true;hideTyping();updateTurnBar();
  const res=recordStat();
  const p=state.scores.p,c=state.scores.c;
  const t=TOPICS[state.topicIdx],rec=recOf(t.id);
  let head,result;
  if(p===c){head="🤝 平局！";result="双方势均力敌，旗鼓相当，为你们精彩的表现鼓掌！";}
  else{
    const win=p>c?"p":"c";
    head=`🏆 ${sideWord(win)}获胜！`;
    result=`「${sideName(win)}」以 ${Math.max(p,c)} : ${Math.min(p,c)} 的比分赢得辩论。`;
  }
  const g=state.growth,lv=levelInfo(g.pts);
  const gainLines=[
    `本局得分 <b>${res?res.mine:0}</b> 分${res&&res.bonus?` ＋ 胜利奖励 <b>${res.bonus}</b> 分`:""} → 积分 <b>+${res?res.gain:0}</b>`,
    `累计 ${g.pts} 积分 · Lv.${lv.cur.lv}「${lv.cur.name}」${lv.maxed?"（已满级）":`（距 Lv.${lv.next.lv} 还差 ${lv.remain} 分）`}`
  ];
  if(res&&res.levelUp)gainLines.push(`<span class="lvup">🎉 升级啦！现在是 Lv.${lv.cur.lv}「${lv.cur.name}」</span>`);
  if(g.streak>=2)gainLines.push(`🔥 当前 ${g.streak} 连胜（最高 ${g.bestStreak} 连胜）`);
  gainLines.push(`本题战绩：已辩 ${rec.plays} 次 · 你的最佳 ${rec.best} 分 · 胜 ${rec.wins} 场`);

  addSys(`${head}<div class="sub2">${result} 最终比分 — 正方 ${p} 分 ： 反方 ${c} 分</div>
    <div class="gain">${gainLines.join("<br>")}</div>
    <button class="batch-btn" onclick="backHome()">再来一局</button>`);
}
function backHome(){
  hideTyping();
  $("debateView").classList.add("hidden");
  $("homeView").classList.remove("hidden");
  state.topicIdx=null;state.side=null;usedArgs={p:new Set(),c:new Set()};
  renderGrowth();drawCards();
}

/* ==================== 语音输入 ==================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let recog=null,recording=false,voiceBase="";
function voiceMsg(text,warn){
  const el=$("voiceHint");
  el.textContent=text;
  el.classList.remove("hidden");
  el.classList.toggle("warn",!!warn);
}
function setRecording(on){
  recording=on;
  const b=$("voiceBtn");
  b.classList.toggle("rec",on);
  b.textContent=on?"⏹":"🎤";
  b.title=on?"点击结束语音输入":"点击开始语音输入";
}
function initVoice(){
  const b=$("voiceBtn");
  if(!SR){
    b.classList.add("off");
    b.title="当前浏览器不支持语音输入";
    voiceMsg("当前浏览器不支持语音输入，请改用打字。",true);
    b.onclick=()=>voiceMsg("当前浏览器不支持语音输入，请改用打字。",true);
    return;
  }
  b.onclick=()=>{
    if(state.finished){voiceMsg("本场辩论已结束，回首页再开一局吧。",true);return;}
    if(recording){try{recog.stop();}catch(e){}return;}
    if(state.mode==="pve"&&state.waiting){voiceMsg("对方正在思考，等它说完再开口～");return;}
    try{recog=new SR();}catch(e){voiceMsg("语音识别启动失败，请改用打字。",true);return;}
    recog.lang="zh-CN";recog.interimResults=true;recog.continuous=false;
    voiceBase=$("msgInput").value;
    recog.onstart=()=>{setRecording(true);voiceMsg("正在听……说完再点一次麦克风结束");};
    recog.onresult=e=>{
      let txt="";
      for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;
      const inp=$("msgInput");
      inp.value=(voiceBase+txt).slice(0,200);
      voiceMsg("识别中：" + (txt.trim()||"…"));
    };
    recog.onerror=ev=>{
      setRecording(false);
      const map={
        "not-allowed":"没有麦克风权限，请改用打字。",
        "service-not-allowed":"语音服务不可用，请改用打字。",
        "network":"网络异常，语音识别失败，请改用打字。",
        "no-speech":"没听到声音，请再说一次，或者改用打字。",
        "audio-capture":"没检测到麦克风，请改用打字。"
      };
      voiceMsg(map[ev.error]||"语音识别失败，请改用打字。",true);
    };
    recog.onend=()=>{
      setRecording(false);
      if($("msgInput").value.trim())voiceMsg("已填进输入框，检查一下再点「发言」");
      else voiceMsg("没有识别到内容，请改用打字。",true);
    };
    try{recog.start();}catch(e){voiceMsg("语音识别启动失败，请改用打字。",true);}
  };
}

$("sendBtn").onclick=send;
$("msgInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)send();});
$("backBtn").onclick=backHome;
$("endBtn").onclick=()=>{if(!state.finished&&state.msgCount>0)finish();};

/* 初始化（存档坏掉也只当空存档，页面永远能正常显示） */
state.turnSide="p";
function safeRender(){
  try{
    renderGrowth();drawCards();
  }catch(e){
    try{
      state.stats={};state.growth=Object.assign({},DEFAULT_GROWTH);
      renderGrowth();drawCards();
    }catch(e2){
      /* 再失败就保持静态页面，绝不让整页白屏 */
      const grid=$("cardGrid");
      if(grid)grid.innerHTML='<div class="draw-tip">卡牌加载出了点小问题，刷新一下就好～</div>';
    }
  }
}
(function init(){
  let saved=null;
  try{saved=loadSave();}catch(e){saved=null;}
  const ok=saved&&typeof saved==="object"&&saved.stats&&saved.growth;
  state.mode=ok&&saved.mode==="pvp"?"pvp":"pve";
  state.diff=ok&&[0,1,2].includes(saved.diff)?saved.diff:0;
  state.stats=ok?saved.stats:{};
  state.growth=Object.assign({},DEFAULT_GROWTH,ok?saved.growth:{});
  try{
    $("modeRow").querySelectorAll(".opt").forEach(el=>el.classList.toggle("sel",el.dataset.mode===state.mode));
    $("diffRow").querySelectorAll(".opt").forEach(el=>el.classList.toggle("sel",+el.dataset.diff===state.diff));
  }catch(e){}
  safeRender();
  try{initVoice();}catch(e){}
  saveGame();   // 旧版存档顺手补齐字段、坏存档写回空档
})();
</script>
