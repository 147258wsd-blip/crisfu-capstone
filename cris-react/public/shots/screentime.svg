<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" width="720" height="266">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1424"/>
      <stop offset=".5" stop-color="#111430"/>
      <stop offset="1" stop-color="#1A1030"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".62"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".62"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity=".7"/>
      <stop offset="1" stop-color="#34D399" stop-opacity=".34"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="720" height="266" fill="url(#bg)"/>
  <rect width="720" height="266" fill="url(#grid)"/>

  <!-- horizontal guides -->
  <g stroke="#ffffff" stroke-opacity=".07" stroke-width="1" stroke-dasharray="3 6">
    <line x1="64" y1="86" x2="660" y2="86"/>
    <line x1="64" y1="124" x2="660" y2="124"/>
    <line x1="64" y1="162" x2="660" y2="162"/>
  </g>

  <!-- baselines -->
  <line x1="64" y1="200" x2="660" y2="200" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.2"/>
  <line x1="64" y1="200" x2="64" y2="66" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>

  <!-- stacked bars; columns 5 and 6 are the missing days, left as outlines -->
  <g>
    <rect x="78"  y="167" width="30" height="33" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="78"  y="141" width="30" height="26" fill="url(#s2)"/>
    <rect x="78"  y="122" width="30" height="19" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>

    <rect x="125" y="160" width="30" height="40" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="125" y="128" width="30" height="32" fill="url(#s2)"/>
    <rect x="125" y="104" width="30" height="24" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>

    <rect x="172" y="171" width="30" height="29" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="172" y="148" width="30" height="23" fill="url(#s2)"/>
    <rect x="172" y="130" width="30" height="18" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>

    <rect x="219" y="155" width="30" height="45" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="219" y="119" width="30" height="36" fill="url(#s2)"/>
    <rect x="219" y="92"  width="30" height="27" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>

    <rect x="266" y="163" width="30" height="37" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="266" y="134" width="30" height="29" fill="url(#s2)"/>
    <rect x="266" y="112" width="30" height="22" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>

    <rect x="313" y="112" width="30" height="88" rx="3" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-width="1.3" stroke-dasharray="5 5"/>
    <rect x="360" y="112" width="30" height="88" rx="3" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-width="1.3" stroke-dasharray="5 5"/>

    <rect x="407" y="158" width="30" height="42" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="407" y="125" width="30" height="33" fill="url(#s2)"/>
    <rect x="407" y="100" width="30" height="25" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>

    <rect x="454" y="152" width="30" height="48" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="454" y="114" width="30" height="38" fill="url(#s2)"/>
    <rect x="454" y="86"  width="30" height="28" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>

    <rect x="501" y="165" width="30" height="35" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="501" y="137" width="30" height="28" fill="url(#s2)"/>
    <rect x="501" y="116" width="30" height="21" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>

    <rect x="548" y="160" width="30" height="40" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="548" y="128" width="30" height="32" fill="url(#s2)"/>
    <rect x="548" y="104" width="30" height="24" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>

    <rect x="595" y="170" width="30" height="30" rx="2" fill="url(#s1)" stroke="#8B5CF6" stroke-opacity=".28"/>
    <rect x="595" y="146" width="30" height="24" fill="url(#s2)"/>
    <rect x="595" y="128" width="30" height="18" rx="2" fill="url(#s3)" stroke="#34D399" stroke-opacity=".3"/>
  </g>

  <!-- legend: three stacked blocks, no words -->
  <g opacity=".8">
    <rect x="596" y="48" width="14" height="6" rx="3" fill="#34D399" fill-opacity=".8"/>
    <rect x="596" y="57" width="14" height="6" rx="3" fill="#22D3EE" fill-opacity=".8"/>
    <rect x="596" y="66" width="14" height="6" rx="3" fill="#8B5CF6" fill-opacity=".8"/>
  </g>
</svg>
