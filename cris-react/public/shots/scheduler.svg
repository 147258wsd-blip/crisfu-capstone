<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" width="720" height="266">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16120A"/>
      <stop offset=".55" stop-color="#12111A"/>
      <stop offset="1" stop-color="#0B1A26"/>
    </linearGradient>
    <linearGradient id="blkA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="blkB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="blkC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity=".34"/>
      <stop offset="1" stop-color="#34D399" stop-opacity=".14"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity=".55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22D3EE" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="720" height="266" fill="url(#bg)"/>
  <rect width="720" height="266" fill="url(#grid)"/>

  <!-- week header band -->
  <rect x="64" y="40" width="590" height="32" fill="#ffffff" fill-opacity=".06"/>
  <g fill="#ffffff" fill-opacity=".22">
    <rect x="96" y="52" width="34" height="7" rx="3.5"/>
    <rect x="214" y="52" width="34" height="7" rx="3.5"/>
    <rect x="332" y="52" width="34" height="7" rx="3.5"/>
    <rect x="450" y="52" width="34" height="7" rx="3.5"/>
    <rect x="568" y="52" width="34" height="7" rx="3.5"/>
  </g>

  <!-- timetable lines: 5 columns x 5 rows -->
  <g stroke="#ffffff" stroke-opacity=".14" stroke-width="1">
    <line x1="64" y1="40" x2="654" y2="40"/>
    <line x1="64" y1="72" x2="654" y2="72"/>
    <line x1="64" y1="104" x2="654" y2="104"/>
    <line x1="64" y1="136" x2="654" y2="136"/>
    <line x1="64" y1="168" x2="654" y2="168"/>
    <line x1="64" y1="200" x2="654" y2="200"/>
    <line x1="64" y1="40" x2="64" y2="200"/>
    <line x1="182" y1="40" x2="182" y2="200"/>
    <line x1="300" y1="40" x2="300" y2="200"/>
    <line x1="418" y1="40" x2="418" y2="200"/>
    <line x1="536" y1="40" x2="536" y2="200"/>
    <line x1="654" y1="40" x2="654" y2="200"/>
  </g>

  <!-- placed sessions -->
  <g>
    <rect x="70" y="78" width="106" height="52" rx="7" fill="url(#blkA)" stroke="#22D3EE" stroke-opacity=".45"/>
    <rect x="80" y="90" width="58" height="7" rx="3.5" fill="#ffffff" fill-opacity=".38"/>
    <rect x="80" y="104" width="38" height="6" rx="3" fill="#ffffff" fill-opacity=".2"/>

    <rect x="306" y="78" width="106" height="52" rx="7" fill="url(#blkB)" stroke="#8B5CF6" stroke-opacity=".45"/>
    <rect x="316" y="90" width="58" height="7" rx="3.5" fill="#ffffff" fill-opacity=".38"/>
    <rect x="316" y="104" width="38" height="6" rx="3" fill="#ffffff" fill-opacity=".2"/>

    <rect x="424" y="142" width="106" height="52" rx="7" fill="url(#blkC)" stroke="#34D399" stroke-opacity=".4"/>
    <rect x="434" y="154" width="52" height="7" rx="3.5" fill="#ffffff" fill-opacity=".34"/>
    <rect x="434" y="168" width="34" height="6" rx="3" fill="#ffffff" fill-opacity=".18"/>
  </g>

  <!-- the drop target underneath: what would clash -->
  <rect x="188" y="142" width="106" height="52" rx="7" fill="#F87171" fill-opacity=".07"
        stroke="#F87171" stroke-opacity=".8" stroke-width="1.6" stroke-dasharray="6 5"/>

  <!-- the block being dragged, tilted and floating above both rows -->
  <g transform="rotate(-5 241 132)" filter="url(#drop)">
    <rect x="188" y="106" width="106" height="52" rx="7" fill="#22D3EE" fill-opacity=".22" stroke="#22D3EE" stroke-width="1.8"/>
    <rect x="198" y="117" width="58" height="7" rx="3.5" fill="#ffffff" fill-opacity=".5"/>
    <rect x="198" y="131" width="38" height="6" rx="3" fill="#ffffff" fill-opacity=".3"/>
  </g>

  <!-- grab handle -->
  <g fill="#22D3EE" fill-opacity=".8">
    <circle cx="230" cy="114" r="2.6"/>
    <circle cx="241" cy="114" r="2.6"/>
    <circle cx="252" cy="114" r="2.6"/>
  </g>

  <!-- overlap marker -->
  <line x1="188" y1="142" x2="294" y2="194" stroke="#F87171" stroke-opacity=".5" stroke-width="1.4"/>
  <line x1="294" y1="142" x2="188" y2="194" stroke="#F87171" stroke-opacity=".5" stroke-width="1.4"/>
</svg>
