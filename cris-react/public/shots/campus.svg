<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" width="720" height="266">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131A"/>
      <stop offset=".55" stop-color="#06101A"/>
      <stop offset="1" stop-color="#091524"/>
    </linearGradient>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="thumbB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity=".3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="thumbC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".14"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".16" cy=".18" r=".75">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".035"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="266" fill="url(#bg)"/>
  <rect width="720" height="266" fill="url(#grid)"/>
  <rect width="720" height="266" fill="url(#glow)"/>

  <!-- row 1 -->
  <g>
    <rect x="48" y="46" width="192" height="78" rx="10" fill="#ffffff" fill-opacity=".028" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="62" y="64" width="42" height="42" rx="8" fill="url(#thumbA)"/>
    <rect x="118" y="66" width="80" height="6.5" rx="3.2" fill="#ffffff" fill-opacity=".3"/>
    <rect x="118" y="80" width="52" height="5" rx="2.5" fill="#ffffff" fill-opacity=".14"/>
    <rect x="118" y="92" width="40" height="14" rx="7" fill="#22D3EE" fill-opacity=".13" stroke="#22D3EE" stroke-opacity=".36"/>
  </g>

  <g>
    <rect x="264" y="46" width="192" height="78" rx="10" fill="#22D3EE" fill-opacity=".05" stroke="#22D3EE" stroke-opacity=".5" stroke-width="1.4"/>
    <rect x="278" y="64" width="42" height="42" rx="8" fill="url(#thumbB)"/>
    <rect x="334" y="66" width="80" height="6.5" rx="3.2" fill="#ffffff" fill-opacity=".34"/>
    <rect x="334" y="80" width="52" height="5" rx="2.5" fill="#ffffff" fill-opacity=".16"/>
    <rect x="334" y="92" width="40" height="14" rx="7" fill="#22D3EE" fill-opacity=".2" stroke="#22D3EE" stroke-opacity=".5"/>
  </g>

  <g>
    <rect x="480" y="46" width="192" height="78" rx="10" fill="#ffffff" fill-opacity=".028" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="494" y="64" width="42" height="42" rx="8" fill="url(#thumbC)"/>
    <rect x="550" y="66" width="80" height="6.5" rx="3.2" fill="#ffffff" fill-opacity=".3"/>
    <rect x="550" y="80" width="52" height="5" rx="2.5" fill="#ffffff" fill-opacity=".14"/>
    <rect x="550" y="92" width="40" height="14" rx="7" fill="#22D3EE" fill-opacity=".13" stroke="#22D3EE" stroke-opacity=".36"/>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="48" y="142" width="192" height="78" rx="10" fill="#ffffff" fill-opacity=".028" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="62" y="160" width="42" height="42" rx="8" fill="url(#thumbB)"/>
    <rect x="118" y="162" width="80" height="6.5" rx="3.2" fill="#ffffff" fill-opacity=".3"/>
    <rect x="118" y="176" width="52" height="5" rx="2.5" fill="#ffffff" fill-opacity=".14"/>
    <rect x="118" y="188" width="40" height="14" rx="7" fill="#22D3EE" fill-opacity=".13" stroke="#22D3EE" stroke-opacity=".36"/>
