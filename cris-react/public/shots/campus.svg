  <g>
    <rect x="480" y="142" width="192" height="78" rx="10" fill="#ffffff" fill-opacity=".028" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="494" y="160" width="42" height="42" rx="8" fill="url(#thumbA)"/>
    <rect x="550" y="162" width="80" height="6.5" rx="3.2" fill="#ffffff" fill-opacity=".3"/>
    <rect x="550" y="176" width="52" height="5" rx="2.5" fill="#ffffff" fill-opacity=".14"/>
    <rect x="550" y="188" width="40" height="14" rx="7" fill="#22D3EE" fill-opacity=".13" stroke="#22D3EE" stroke-opacity=".36"/>
  </g>
